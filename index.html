:root{
  /* hoja imprimible (no tocar: la usa .sheet) */
  --mcf:#00489a; --celeste:#70C0DE; --gold:#D96B58; --gk:#D96B58; --gk-num:#000000;
  /* blanquiazul */
  --blue:#00489a; --blue-d:#00387a; --blue-t:#e6eef8; --cel:#70c0de; --cel-t:#e3f3f9;
  --ink:#0b1e3a; --muted:#56657a; --line:#d9e2ec; --line-2:#c3cfdc; --bg:#f4f7fa; --card:#ffffff;
  --blue-tx:#00489a; --navy:#0b1e3a; --panel:#ffffff;
  --slate:#4a5566; --slate-tx:#4a5566; --slate-t:#eef1f4; --warn-tx:#8a1c14;
  --red:#c62828; --red-t:#fdecea; --amber:#b45309; --amber-t:#fff4e0; --green:#0f7a3e; --green-t:#e5f4ec;
  --stripe:repeating-linear-gradient(90deg,var(--blue) 0 44px,#fff 44px 88px);
  --num:'Teko',Barlow,sans-serif;
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --blue:#1d5bb0; --blue-d:#174a90; --blue-tx:#8fbaf2; --blue-t:#152c4f; --cel-t:#0f2b3b;
    --ink:#e7eef7; --muted:#9db0c6; --line:#22344d; --line-2:#30486a; --bg:#0b1524; --card:#132036; --panel:#132036;
    --slate:#5b677a; --slate-tx:#aab5c5; --slate-t:#1c2738;
    --red-t:#3a1717; --amber-t:#3a2a12; --green-t:#10301f; --warn-tx:#ffb4ab;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.35}
::selection{background:var(--cel);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line-2);background:var(--card);border-radius:var(--r);padding:9px 14px;min-height:44px;font-weight:600;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background-color .15s,border-color .15s,transform .08s}
button:hover{border-color:var(--blue)}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--cel);outline-offset:2px}
input,select{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);padding:9px 11px;width:100%;min-height:44px}
input:focus,select:focus{border-color:var(--blue)}
input::placeholder{color:#6b7a8f}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}

/* ---------- cabecera: la camiseta ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--stripe);padding:14px 24px;border-bottom:3px solid var(--ink)}
.panel{max-width:1180px;margin:0 auto;background:var(--panel);border-radius:12px;box-shadow:0 8px 22px rgba(11,30,58,.28);padding:12px 18px;display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:8px 20px}
.cl-head{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted)}
.phase{background:var(--blue);color:#fff;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:5px;white-space:nowrap}
.phase.paused{background:var(--amber)}
.minlbl{white-space:nowrap}
.minlbl b{color:var(--ink)}
.clock{display:flex;align-items:flex-end;gap:8px}
.clock #time{font-family:var(--num);font-weight:600;font-size:76px;line-height:.78;padding-top:12px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.added{font-family:var(--num);font-weight:600;font-size:26px;line-height:1;padding:4px 7px 0;border-radius:5px;background:var(--red);color:#fff;margin-bottom:4px}
.adj{display:grid;grid-template-columns:repeat(2,56px);gap:6px}
.adj button{min-height:34px;padding:0;font-size:15px;background:var(--bg);border-color:var(--line)}
.score{justify-self:center;display:flex;align-items:center;gap:14px;padding:0 20px;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:84px}
.score .ab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700;letter-spacing:.06em;min-width:52px}
.score img{width:38px;height:38px;object-fit:contain}
.score .ab>span:empty{display:none}
.crest-ph{display:block;width:32px;height:38px;background:var(--slate-t);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);box-shadow:inset 0 0 0 40px var(--line-2)}
.score #score i{font-style:normal;color:var(--cel);margin:0 .08em}
.score #score.bump{animation:bump .6s cubic-bezier(.2,.9,.3,1.4)}
@keyframes bump{40%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.score #score.bump,.attcard.ready{animation:none}}
.score #score{font-family:var(--num);font-weight:600;font-size:70px;line-height:.78;padding-top:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ctl{display:flex;flex-direction:column;align-items:stretch;gap:8px;min-width:250px}
.ctrls{display:flex;gap:8px}
.ctrls button{flex:1;font-size:17px;font-weight:700;min-height:50px;border:2px solid var(--ink)}
.btn-play{background:var(--blue);color:#fff;border-color:var(--blue)!important}
.btn-play:hover{background:var(--blue-d)}
.btn-play.pause{background:var(--card);color:var(--blue-tx)}
.btn-play.new{background:var(--navy);border-color:var(--navy)!important}
.btn-phase{background:var(--card);color:var(--ink)}
.wins{display:flex;gap:14px;justify-content:flex-end;font-size:13px;font-weight:700;color:var(--muted)}
.wg{display:flex;align-items:center;gap:4px}
.wg>span:first-child{margin-right:3px;letter-spacing:.04em}
.wc{min-width:30px;padding:3px 4px 0;height:24px;border:1.5px solid var(--line-2);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:600;font-size:18px;line-height:1;padding-top:3px;color:var(--muted)}
.wc.used{border-color:var(--blue);color:#fff;background:var(--blue);box-shadow:inset 0 -4px 0 rgba(255,255,255,.55)}
.wc:not(.used){font-family:Barlow,sans-serif;font-size:12px;font-weight:700;padding-top:0;border-style:dashed}
.wg.riv .wc.used{border-color:var(--slate);background:var(--slate)}
.wg.full>span:first-child{color:var(--red)}

/* ---------- atención ---------- */
.att{position:sticky;top:0;z-index:15;max-width:1180px;margin:0 auto;padding:0 16px}
.attcard{margin-top:10px;background:var(--amber);color:#fff;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 16px rgba(11,30,58,.25)}
.attcard.ready{background:var(--green);animation:pulse .9s infinite alternate}
@keyframes pulse{to{box-shadow:0 6px 16px rgba(11,30,58,.25),0 0 0 6px rgba(15,122,62,.35)}}
.attcard .cd{font-family:var(--num);font-weight:600;font-size:46px;line-height:.8;padding-top:8px;min-width:96px;font-variant-numeric:tabular-nums}
.attcard .cd .ic{width:36px;height:36px;stroke-width:3}
.attcard .who{flex:1;font-weight:700;font-size:17px;line-height:1.2}
.attcard .who small{display:block;font-weight:500;font-size:14px;opacity:.95}
.attcard button{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5);color:#fff}

/* ---------- pestañas ---------- */
nav.tabs{display:flex;gap:2px;max-width:1180px;margin:0 auto;padding:10px 16px 0}
nav.tabs button{flex:0 1 180px;border:0;border-radius:0;background:transparent;color:var(--muted);font-size:17px;font-weight:700;position:relative;min-height:48px}
nav.tabs button:hover{color:var(--blue-tx)}
nav.tabs button.on{color:var(--blue-tx)}
nav.tabs button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:6px;border-top:1.5px solid var(--blue);background:repeating-linear-gradient(90deg,var(--blue) 0 8px,#fff 8px 13px)}
main{max-width:1180px;margin:0 auto;padding:0 16px 96px}
main>section{border-top:1px solid var(--line-2);padding:18px 0 0}
h3{margin:22px 0 10px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:baseline;gap:8px}
h3:first-child{margin-top:0}
h3 small{font-weight:500;text-transform:none;letter-spacing:0;font-size:14px}
.note{font-size:14px;color:var(--muted);margin:8px 0}
.note b{color:var(--ink)}

.banner{background:var(--cel-t);border:1px solid var(--cel);border-radius:var(--r);padding:11px 14px;margin-bottom:14px;font-weight:600;display:flex;gap:10px;align-items:center}
.banner .ic{color:var(--blue-tx)}

/* ---------- partido ---------- */
.livegrid{display:grid;grid-template-columns:minmax(260px,350px) minmax(0,1fr);gap:24px;align-items:start}
.pitchcol{min-width:0}
#pitch{background:repeating-linear-gradient(0deg,#3c9a4e 0 9.52%,#36904a 9.52% 19.04%);border-radius:12px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.12)}
#pitch .slot{width:84px}
#pitch .tok{width:46px;height:46px;background:var(--blue);color:#fff;border:3px solid #fff;font-family:var(--num);font-weight:600;font-size:30px;line-height:1;padding-top:5px;box-shadow:0 3px 6px rgba(0,0,0,.3)}
#pitch .tok.gk{background:var(--navy);color:var(--cel)}
#pitch .slot.empty .tok{background:rgba(255,255,255,.14);border:2px dashed rgba(255,255,255,.8);font-family:Barlow,sans-serif;font-size:11px;font-weight:700;padding:0;box-shadow:none}
#pitch .slot.sel .tok{outline:4px solid var(--cel);outline-offset:2px}
#pitch .slot.hurt .tok{border-color:#ffb547;box-shadow:0 0 0 4px var(--amber)}
#pitch .tn{display:inline-block;max-width:100%;margin-top:4px;font-size:13px;font-weight:700;color:#fff;background:rgba(11,30,58,.82);padding:1px 7px;border-radius:4px;text-shadow:none}
#pitch .tn:empty{display:none}

.acts{display:grid;gap:14px}
.evcol h4{margin:0 0 8px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--blue-tx);display:flex;align-items:center;gap:8px}
.evcol h4 img{width:22px;height:22px;object-fit:contain}
.evcol.riv h4{color:var(--slate-tx)}
.evbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.evbtns button{justify-content:flex-start;gap:9px;min-height:56px;padding:6px 10px;font-size:15px;text-align:left;line-height:1.1;border-color:var(--line-2)}
.evbtns button .ic{color:var(--blue-tx)}
.evbtns button .l{flex:1;min-width:0}
.evbtns button .c{margin-left:6px;font-family:var(--num);font-weight:600;font-size:28px;line-height:.8;padding-top:5px;color:var(--blue-tx);font-variant-numeric:tabular-nums}
.evbtns button.gol{background:var(--blue);border-color:var(--blue);color:#fff}
.evbtns button.gol .ic,.evbtns button.gol .c{color:#fff}
.evbtns button.gol:hover{background:var(--blue-d)}
.riv .evbtns button .ic,.riv .evbtns button .c{color:var(--slate-tx)}
.riv .evbtns button:hover{border-color:var(--slate)}
.riv .evbtns button.gol{background:var(--slate);border-color:var(--slate);color:#fff}
.riv .evbtns button.gol .ic,.riv .evbtns button.gol .c{color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.pl{display:flex;align-items:stretch;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--card)}
.pl.on{border-color:var(--blue)}
.pl.hurt{border-color:var(--amber);background:var(--amber-t)}
.pl-main{flex:1;display:flex;align-items:center;gap:10px;padding:6px 10px;cursor:pointer;min-width:0;min-height:52px}
.pl-main:hover .nm{color:var(--blue-tx)}
.dor{font-family:var(--num);font-weight:600;font-size:28px;line-height:.8;padding-top:6px;min-width:38px;height:38px;border-radius:6px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.pl:not(.on) .dor{background:var(--blue-t);color:var(--blue-tx)}
.dor.gk,.pl:not(.on) .dor.gk{background:var(--navy);color:var(--cel)}
.nm{flex:1;line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.nm small{display:block;color:var(--muted);font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.pm{font-family:var(--num);font-weight:600;font-size:24px;line-height:.8;padding-top:5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pl-acts{display:flex;border-left:1px solid var(--line)}
.pl-acts button{border:0;border-radius:0;min-height:0;min-width:46px;padding:0;background:transparent;color:var(--blue-tx)}
.pl-acts button+button{border-left:1px solid var(--line)}
.pl-acts button:hover{background:var(--blue-t)}
.pl-acts button[data-act=att]{color:var(--amber)}
.pl .tag{font-size:12px;color:var(--amber);font-weight:700;display:block}

.log{list-style:none;margin:0;padding:0;max-height:380px;overflow:auto;border:1px solid var(--line-2);border-radius:var(--r);background:var(--card)}
.log li{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 6px;border-bottom:1px solid var(--line);font-size:15px}
.log li:last-child{border-bottom:none}
.log::after{content:"";display:block;position:sticky;bottom:0;height:30px;margin-top:-30px;background:linear-gradient(transparent,var(--card));pointer-events:none}
.log .lm{font-family:var(--num);font-weight:600;font-size:24px;line-height:.8;padding:6px 6px 0;min-width:64px;min-height:40px;border:0;background:var(--blue-t);color:var(--blue-tx);font-variant-numeric:tabular-nums}
.log .lm:disabled{opacity:1;background:var(--bg);color:var(--muted)}
.log .lt{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.log .lt .ic{color:var(--blue-tx);width:18px;height:18px}
.log .lt small{color:var(--muted);font-size:13px}
.log .wb{min-height:30px;padding:0 9px;border:1.5px solid var(--blue-tx);background:var(--card);border-radius:5px;font-size:13px;font-weight:700;color:var(--blue-tx)}
.log .rv{color:var(--slate-tx);font-weight:700;font-size:13px;letter-spacing:.06em}
.log li.riv .lt .ic{color:var(--slate-tx)}
.log .del{border:0;background:transparent;color:var(--muted);min-width:44px;padding:0}
.log .del:hover{color:var(--red)}
.log .empty{color:var(--muted);justify-content:center;padding:18px}
.cardsw{display:inline-block;width:12px;height:16px;border-radius:2px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.cardsw.A{background:#f5c518}.cardsw.R{background:#d62d20}
.cardsw.D{background:linear-gradient(135deg,#f5c518 50%,#d62d20 50%)}
.endrow{display:flex;justify-content:center;margin-top:22px}
.endrow button,.actions .gold{border:2px solid var(--ink)}

/* ---------- modal y diálogos ---------- */
.modal,.dlg{position:fixed;inset:0;background:rgba(11,30,58,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.dlg{z-index:70;align-items:center}
@media (min-width:640px){.modal{align-items:center}}
.mbox,.dbox{background:var(--card);border-radius:14px;width:100%;max-width:620px;max-height:88vh;overflow:auto;padding:18px 20px;box-shadow:0 18px 50px rgba(11,30,58,.35)}
.dbox{max-width:440px}
.dmsg{white-space:pre-line;margin:0 0 14px;font-size:16px;line-height:1.45}
.mbox h2{margin:0 0 6px;font-size:21px;display:flex;align-items:center;gap:10px}
.mbox h2 .ic{color:var(--blue-tx);width:24px;height:24px}
.mbox h4{margin:16px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pick{justify-content:flex-start;gap:10px;padding:6px 12px;min-height:50px}
.pick b{font-family:var(--num);font-weight:600;font-size:26px;line-height:.8;padding-top:5px;color:var(--blue-tx);min-width:26px}
.pick.sel,.seg button.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.pick.sel b{color:#fff}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:150px;min-height:50px}
.seg button.ht{border-color:var(--cel)}
.seg button.ht.sel{background:var(--cel);color:var(--ink);border-color:var(--blue)}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.mact button{min-width:120px}
.mact .primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.mact .primary:hover{background:var(--blue-d)}
.mact .dangerb{background:var(--red);border-color:var(--red)}
.warn{font-size:14px;margin:10px 0;padding:10px 12px;border-radius:var(--r);background:var(--red-t);color:var(--warn-tx);border:1px solid #f1b9b3}
.info{font-size:14px;margin:10px 0;padding:10px 12px;border-radius:var(--r);background:var(--cel-t);border:1px solid var(--cel)}
.row{display:flex;gap:8px}
.row .pick{flex:none}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);border:1px solid var(--line-2);color:#fff;padding:8px 8px 8px 16px;border-radius:10px;z-index:60;display:flex;gap:14px;align-items:center;font-size:15px;font-weight:600;max-width:92vw;box-shadow:0 10px 28px rgba(11,30,58,.35)}
.toast button{background:transparent;border:1.5px solid var(--cel);color:var(--cel);min-height:38px}

/* ---------- ajustes ---------- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:14px}
.fld span{color:var(--muted);font-weight:600}
.crests{display:flex;gap:12px;flex-wrap:wrap}
.crestbox{display:flex;align-items:center;gap:14px;border:1px solid var(--line-2);border-radius:var(--r);padding:10px 14px;background:var(--card)}
.crestbox img{width:52px;height:52px;object-fit:contain}
.crestbox .ph{width:52px;height:52px;border:1.5px dashed var(--line-2);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.roster{width:100%;border-collapse:collapse;font-size:15px;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r)}
.roster th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 6px}
.roster td{padding:4px 6px;border-top:1px solid var(--line)}
.roster input{min-height:40px;border-color:var(--line)}
.roster input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--blue)}
.roster .n{width:70px;font-family:var(--num);font-size:22px;padding-top:6px;padding-bottom:2px}
.roster td:last-child button{min-width:44px;padding:0;color:var(--muted);border-color:transparent;background:transparent}
.roster td:last-child button:hover{color:var(--red)}
.rwrap{overflow-x:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions .danger{color:var(--red);border-color:var(--red)}
.crestbox .actions{margin-top:6px}
.crestbox .actions button{min-height:36px;padding:4px 12px;font-size:14px}

/* ---------- pestaña hoja (solo los controles de la app) ---------- */
#tab-sheet .sheet{line-height:normal}
#tab-sheet .sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px;flex-wrap:wrap}
#tab-sheet .sheet-actions button{background:var(--blue);color:#fff;border-color:var(--blue)}
.sheet-wrap{box-shadow:0 2px 10px rgba(11,30,58,.12);border:1px solid var(--line)}

/* ---------- partidos guardados ---------- */
.arch{list-style:none;margin:0;padding:0;border:1px solid var(--line-2);border-radius:var(--r);background:var(--card)}
.arch li{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line)}
.arch li:last-child{border-bottom:0}
.arch-t{flex:1;min-width:0}
.arch-t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arch-t small{color:var(--muted);font-size:13px}
.arch-now{color:var(--blue-tx);font-weight:700}
.arch button{min-height:40px}
.arch button[data-act=arch-dl],.arch .arch-del{min-width:44px;padding:0;color:var(--muted)}
.arch .arch-del:hover{color:var(--red);border-color:var(--red)}

/* ---------- firma ---------- */
.credit{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:center;align-items:baseline;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);letter-spacing:.02em}
.credit span+span::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--cel);margin-right:14px;vertical-align:middle}
.credit .who{font-weight:700;color:var(--ink);letter-spacing:.06em;text-transform:uppercase}

/* ---------- tablet vertical y móvil ---------- */
@media (max-width:1000px){
  .panel{grid-template-columns:auto 1fr auto;padding:10px 14px}
  .ctl{grid-column:1/-1;flex-direction:row;align-items:center;min-width:0}
  .ctrls{flex:1}
  .wins{flex-direction:column;gap:4px;align-items:flex-end}
  .clock #time{font-size:64px}
  .score #score{font-size:58px}
  .score{min-height:70px;padding:0 14px}
  .evbtns{grid-template-columns:repeat(2,minmax(0,1fr))}
  .livegrid{grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:0 18px}
  .listcol{display:contents}
  .pitchcol,.acts{grid-row:1}
  .listcol>h3,.listcol>.grid{grid-column:1/-1}
  #pitch .slot{width:70px}
  #pitch .tok{width:40px;height:40px;font-size:26px}
  #pitch .tn{font-size:12px;padding:0 5px}
}
@media (max-width:640px){
  .bar{padding:8px}
  .panel{grid-template-columns:1fr auto;gap:10px 10px;padding:10px 12px}
  .cl-head{gap:6px;font-size:13px}
  .phase{font-size:12px;padding:2px 7px}
  .adj{grid-column:1/-1;grid-template-columns:repeat(4,1fr);order:3}
  .score{border:0;padding:0;min-height:0;gap:8px}
  .score .ab{min-width:0;font-size:11px}
  .score #score{font-size:46px}
  .score img{width:28px;height:28px}
  .clock #time{font-size:54px}
  .ctl{order:4;flex-direction:column;align-items:stretch}
  .wins{flex-direction:row;justify-content:space-between}
  .livegrid{grid-template-columns:1fr;gap:0}
  .pitchcol,.acts{grid-row:auto}
  .acts{margin-top:18px}
  .pitchcol{position:static;max-width:380px;margin:0 auto;width:100%}
  .evbtns{grid-template-columns:repeat(2,minmax(0,1fr))}
  nav.tabs button{flex:1}
}

/* ---------- campo (base compartida con la hoja imprimible) ---------- */
.pitch{position:relative;width:100%;aspect-ratio:68/105;background:repeating-linear-gradient(0deg,#2f8a3e 0 9.52%,#2a7e38 9.52% 19.04%);border-radius:10px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:76px;text-align:center;touch-action:none;cursor:grab;z-index:2}
.slot.dragging{z-index:5;cursor:grabbing;opacity:.9}
.tok{width:40px;height:40px;margin:0 auto;border-radius:50%;background:var(--mcf);color:var(--gold);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.tok.gk{background:var(--gk);color:var(--gk-num)}
.slot.hurt .tok{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange)}
.slot.empty .tok{background:rgba(255,255,255,.15);border:2px dashed rgba(255,255,255,.7);color:#fff;font-size:10px;font-weight:600;box-shadow:none}
.slot.sel .tok{outline:3px solid var(--celeste);outline-offset:2px}
.tn{margin-top:3px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- hoja (siempre clara, como el papel) ---------- */
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px;flex-wrap:wrap}
.sheet-actions button{background:var(--mcf);color:#fff;border:none;font-weight:600}
.sheet-wrap{overflow-x:auto;background:#fff;border-radius:8px}
.sheet{width:780px;margin:0 auto;color:#000;background:#fff;font-family:Calibri,Carlito,Arial,sans-serif;font-size:10.5px;padding:14px}
.sheet table{border-collapse:collapse}
.sheet td,.sheet th{border:1px solid #000;padding:1px 3px;height:16px;text-align:center;font-weight:400}
.sh-top{display:flex;gap:12px;align-items:flex-start}
.sh-crest{width:74px;height:84px;object-fit:contain;flex:none}
.sh-titlebox{flex:1;text-align:right}
.sh-title{font-size:24px;letter-spacing:.5px}
.wt{margin-left:auto;margin-top:2px}
.wt td,.wt th{width:24px;font-size:9.5px;height:15px}
.wt th{border:none;font-weight:700}
.wt .tl{width:auto;font-size:9px;padding:0 3px}
.wt .gap{border:none;width:14px}
.sh-match{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 2px;font-size:14px;font-weight:700;border-bottom:1px solid #000;padding-bottom:4px}
.sh-match img{width:30px;height:30px;object-fit:contain}
.sh-match .vs{font-weight:400;font-size:12px}
.sh-match .rbox{display:inline-block;min-width:150px;border-bottom:1px dotted #000;text-align:center}
.ir{display:flex;gap:10px;align-items:flex-end;margin:6px 0}
.ir label{white-space:nowrap;font-size:11px}
.ir .v{flex:1;border-bottom:1px solid #000;text-align:center;min-height:15px;font-size:11px}
.ir .v.s{flex:none;min-width:90px}
.sh-body{display:flex;gap:10px;margin-top:4px;align-items:flex-start}
.pt th{font-size:9px;font-weight:700}
.pt .vert{writing-mode:vertical-rl;transform:rotate(180deg);font-size:8px;height:48px}
.pt td.name{text-align:left;width:178px;white-space:nowrap;overflow:hidden}
.pt td.tot{font-weight:700}
.pt td.sm{width:22px}
.pt .dbl{border-right:3px double #000}
.sh-left{display:flex;flex-direction:column;gap:10px}
.sh-right{flex:1;display:flex;flex-direction:column;gap:3px}
.sh-right table{width:100%}
.sh-right table+.sh-cap,.sh-right table+table{margin-top:8px}
.sh-right .sh-cap+table{margin-top:0}
.sh-cap{font-weight:700;font-size:10px;text-align:center}
.box td{width:26px}
.box .cnt{font-weight:700}
.box th{font-weight:700;font-size:11px}
.box .sub td{font-size:9.5px}
.sh-bottom{display:flex;gap:10px;margin-top:8px;align-items:flex-start}
.sh-bl{display:flex;flex-direction:column;gap:6px}
.sh-row{display:flex;gap:6px;align-items:flex-start}
.gt td.d{text-align:left;width:118px;font-size:9.5px}
.gt th{font-size:9.5px;font-weight:700}
.sh-pitch{flex:1;display:flex;flex-direction:column;align-items:center}
.sh-pitch .cap{font-weight:700;font-size:10px;margin-bottom:2px}
.pitch.sm{width:212px;border-radius:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pitch.sm .slot{width:62px;cursor:default}
.pitch.sm .tok{width:20px;height:20px;font-size:9px;border-width:1px;box-shadow:none}
.pitch.sm .slot.empty{display:none}
.pitch.sm .tn{font-size:8.5px;margin-top:1px}
.sheet .tok{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sh-note{display:none}
.sh-foot{display:none}

@media print{
  @page{size:A4 portrait;margin:6mm}
  body{background:#fff}
  .bar,nav.tabs,#att,#tab-live,#tab-cfg,.sheet-actions,.toast,.modal,.dlg,.credit{display:none!important}
  main{padding:0;max-width:none}
  #tab-sheet{display:block!important;border:none;padding:0}
  .sheet-wrap{overflow:visible;box-shadow:none!important;border:0!important}
  .sheet{padding:0;zoom:.95}
}
</style>

/* ---------- diálogos propios (no dependen de confirm/prompt del navegador) ---------- */
function dialog({msg, input = false, def = '', buttons}){
  return new Promise(res => {
    const d = el('dlg');
    d.innerHTML = `<div class="dbox"><p class="dmsg">${esc(msg)}</p>${input ? `<input id="dlgIn" value="${esc(def)}" autocapitalize="off" autocorrect="off">` : ''}
      <div class="mact">${buttons.map((b, i) => `<button data-i="${i}" class="${b[2] ? 'primary' : ''} ${b[3] ? 'dangerb' : ''}">${esc(b[0])}</button>`).join('')}</div></div>`;
    d.hidden = false;
    d.querySelectorAll('[data-i]').forEach(btn => btn.onclick = () => {
      const b = buttons[+btn.dataset.i];
      const v = (input && b[1] === true) ? el('dlgIn').value : b[1];
      d.hidden = true; d.innerHTML = ''; res(v);
    });
    if (input){ const i = el('dlgIn'); setTimeout(() => { i.focus(); i.select(); }, 60); i.onkeydown = e => { if (e.key === 'Enter') d.querySelector('.primary').click(); }; }
  });
}
const ask = (msg, ok = 'Aceptar', danger = false) => dialog({msg, buttons:[['Cancelar', false], [ok, true, true, danger]]});
const askText = (msg, def) => dialog({msg, input:true, def, buttons:[['Cancelar', null], ['Aceptar', true, true]]});
const say = msg => dialog({msg, buttons:[['Entendido', true, true]]});

/* ---------- reloj y minutos ---------- */
function elapsedMs(){ const c = S.clock; return Math.max(0, c.acc + (c.running ? Date.now() - c.since : 0)); }
function curSec(){ return Math.floor(elapsedMs() / 1000); }
function curHalf(){ return (S.clock.phase === '2T' || S.clock.phase === 'FIN') ? 2 : 1; }
function inPlay(){ return S.clock.phase === '1T' || S.clock.phase === '2T'; }
function label(sec){ return Math.floor(sec / 60) + (S.config.minuteMode === 'current' ? 1 : 0); }
function nomLabel(sec){ return Math.min(label(sec), S.config.halfMin); }
function secFor(l){ return Math.max(0, l - (S.config.minuteMode === 'current' ? 1 : 0)) * 60 + 30; }
function minStr(half, sec, cumulative = true){
  const l = label(sec), hm = S.config.halfMin;
  if (l > hm) return (cumulative ? hm * half : hm) + '+' + (l - hm);
  return String(cumulative ? l + (half === 2 ? hm : 0) : l);
}
function fmt(ms){ const t = Math.floor(Math.max(0, ms) / 1000); return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0'); }
function fmtCd(ms){ const t = Math.ceil(Math.max(0, ms) / 1000); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); }
function parseMin(str){
  const hm = S.config.halfMin; str = String(str || '').trim();
  let m = str.match(/^(\d+)\s*\+\s*(\d+)$/);
  if (m){ const b = +m[1], a = +m[2]; return {half: b <= hm ? 1 : 2, sec: secFor(hm + a)}; }
  if (!/^\d+$/.test(str)) return null;
  const n = +str, half = n <= hm ? 1 : 2;
  return {half, sec: secFor(half === 1 ? n : n - hm)};
}
/* el 2ºT aún no ha arrancado de verdad (primer minuto): un cambio aquí es de descanso */
function early2T(){ return S.clock.phase === '2T' && curSec() < 60; }

/* ---------- derivación: quién está en el campo y minutos jugados ---------- */
function lineup1(){ return S.players.filter(p => p.conv && p.t1).map(p => p.id); }
const expulsions = () => S.events.filter(e => e.team === 'mcf' && e.type === 'tar' && (e.color === 'R' || e.color === '2A') && e.pid);
function derive(){
  const ph = S.clock.phase;
  const L1 = new Set(lineup1());
  const mins = {}; S.players.forEach(p => mins[p.id] = 0);
  const field = new Set(L1);
  if (ph === 'pre') return {field, mins, L1, L2:new Set()};
  const changes = [
    ...S.subs.filter(s => !s.dto).map(s => ({half:s.half, sec:s.sec, out:s.out, in:s.in})),
    ...expulsions().map(e => ({half:e.half, sec:e.sec, out:e.pid, in:null}))
  ].sort((a,b) => a.sec - b.sec);
  const run = (h, end) => {
    const st = {}; field.forEach(id => st[id] = 0);
    for (const c of changes.filter(c => c.half === h)){
      const n = Math.min(nomLabel(c.sec), end);
      if (c.out && field.has(c.out)){ mins[c.out] += Math.max(0, n - st[c.out]); field.delete(c.out); }
      if (c.in && !field.has(c.in)){ field.add(c.in); st[c.in] = n; }
    }
    field.forEach(id => mins[id] += Math.max(0, end - st[id]));
  };
  run(1, ph === '1T' ? nomLabel(curSec()) : nomLabel(S.clock.len[1] || 0));
  if (ph === '1T') return {field, mins, L1, L2:new Set()};
  S.subs.filter(s => s.dto).sort((a,b) => a.t - b.t).forEach(s => { field.delete(s.out); field.add(s.in); });
  const L2 = new Set(field);
  if (ph === 'DT') return {field, mins, L1, L2};
  run(2, ph === '2T' ? nomLabel(curSec()) : nomLabel(S.clock.len[2] || 0));
  return {field, mins, L1, L2};
}
function mcfWindows(){
  const g = {};
  S.subs.filter(s => !s.dto).forEach(s => {
    const w = g[s.win] || (g[s.win] = {win:s.win, half:s.half, sec:s.sec, lastSec:s.sec, n:0});
    w.sec = Math.min(w.sec, s.sec); w.lastSec = Math.max(w.lastSec, s.sec); w.n++;
  });
  return Object.values(g).sort((a,b) => a.half - b.half || a.sec - b.sec);
}
function winsList(team){ return team === 'mcf' ? mcfWindows() : S.rivalWins.filter(w => !w.dto).slice().sort((a,b) => a.half - b.half || a.sec - b.sec); }
/* las ventanas se cuentan por parte: 3 en el 1ºT y 3 en el 2ºT */
function winsUsed(team, half = curHalf()){ return winsList(team).filter(w => w.half === half).length; }
function winNum(win){ const w = mcfWindows().find(x => x.win === win); return w ? mcfWindows().filter(x => x.half === w.half).findIndex(x => x.win === win) + 1 : 0; }
function score(){
  return {l: S.events.filter(e => e.type === 'gol' && e.team === 'mcf').length,
          r: S.events.filter(e => e.type === 'gol' && e.team === 'rival').length};
}

/* ---------- alineación ---------- */
function ensureFormation(){
  const F = S.formation;
  const xi = S.players.filter(p => p.conv && p.t1);
  const ids = new Set(xi.map(p => p.id));
  for (const k in F) if (!ids.has(F[k]) || !SLOT_LBL[k]) delete F[k];
  const placed = new Set(Object.values(F));
  const un = xi.filter(p => !placed.has(p.id)).sort((a,b) => isGK(b) - isGK(a));
  for (const p of un){
    const tk = String(p.pos || '').split(/[-_ ]/)[0].toUpperCase();
    const pref = (POS_PREF[tk] || []).filter(k => !F[k]);
    const k = pref[0] || SLOTS.map(s => s[0]).find(k => !F[k] && k !== 'por') || SLOTS.map(s => s[0]).find(k => !F[k]);
    if (!k) break;
    F[k] = p.id;
  }
}
const ordKey = x => [x.dto ? 1.5 : x.half, x.sec, x.t || 0];
/* posiciones actuales: alineación inicial + cambios (la que entra ocupa el sitio de la que sale) + intercambios */
function liveSlots(){
  ensureFormation();
  const F = Object.assign({}, S.formation);
  if (S.clock.phase === 'pre') return F;
  const seq = [
    ...S.subs.map(s => ({k:ordKey(s), type:'sub', out:s.out, in:s.in})),
    ...expulsions().map(e => ({k:ordKey(e), type:'exp', out:e.pid})),
    ...S.swaps.map(w => ({k:ordKey(w), type:'swap', a:w.a, b:w.b})),
  ].sort((x,y) => x.k[0] - y.k[0] || x.k[1] - y.k[1] || x.k[2] - y.k[2]);
  const slotOf = id => Object.keys(F).find(k => F[k] === id);
  for (const c of seq){
    if (c.type === 'sub'){
      if (slotOf(c.in)) continue;
      const k = slotOf(c.out);
      if (k) F[k] = c.in;
      else { const e = SLOTS.map(s => s[0]).find(s => !F[s]); if (e) F[e] = c.in; }
    } else if (c.type === 'exp'){ const k = slotOf(c.out); if (k) delete F[k]; }
    else { const t = F[c.a]; if (F[c.b]) F[c.a] = F[c.b]; else delete F[c.a]; if (t) F[c.b] = t; else delete F[c.b]; }
  }
  return F;
}
const PITCH_SVG = `<svg class="lines" viewBox="0 0 68 105" preserveAspectRatio="none" aria-hidden="true">
  <g fill="none" stroke="rgba(255,255,255,.85)" stroke-width=".45">
  <rect x="2" y="2" width="64" height="101"/><line x1="2" y1="52.5" x2="66" y2="52.5"/><circle cx="34" cy="52.5" r="8.5"/>
  <rect x="14" y="2" width="40" height="15.5"/><rect x="24.5" y="2" width="19" height="5.5"/>
  <rect x="14" y="87.5" width="40" height="15.5"/><rect x="24.5" y="97.5" width="19" height="5.5"/></g>
  <g fill="rgba(255,255,255,.85)"><circle cx="34" cy="52.5" r=".6"/><circle cx="34" cy="13" r=".5"/><circle cx="34" cy="92" r=".5"/></g></svg>`;
let selSlot = null;
function pitchHTML(map, small){
  const hurt = new Set(activeAtts().map(a => a.pid));
  return PITCH_SVG + SLOTS.map(([k, l, x, y]) => {
    const p = map[k] && P(map[k]);
    return `<div class="slot ${p ? '' : 'empty'} ${!small && selSlot === k ? 'sel' : ''} ${!small && p && hurt.has(p.id) ? 'hurt' : ''}" data-slot="${k}" style="left:${x}%;top:${y}%">
      <div class="tok ${k === 'por' ? 'gk' : ''}">${p ? esc(p.dorsal) : l}</div><div class="tn">${p ? esc(p.corto || p.nombre) : ''}</div></div>`;
  }).join('');
}
function pitchMode(){ const ph = S.clock.phase; return ph === 'pre' ? 'pre' : ph === 'FIN' ? 'ro' : 'live'; }
let curMap = {};
function renderPitch(){
  const mode = pitchMode();
  if (mode === 'pre'){ ensureFormation(); curMap = S.formation; } else curMap = liveSlots();
  el('pitch').innerHTML = pitchHTML(curMap, false);
  el('pitchTitle').textContent = (mode === 'pre' ? 'Alineación inicial · ' : 'En el campo ahora · ') + FORMATION;
  el('pitchHelp').innerHTML = mode === 'pre'
    ? '<b>Arrastra</b> una jugadora sobre otra para intercambiar posiciones (o toca una y luego otra). Para cambiar una titular, toca una jugadora del banquillo.'
    : mode === 'live' ? '<b>Toca</b> una jugadora para hacer un cambio · <b>arrastra</b> para cambiar su posición.' : 'Partido finalizado.';
}
function swapFormation(a, b){
  if (a === b){ renderPitch(); return; }
  const F = S.formation, t = F[a];
  if (F[b]) F[a] = F[b]; else delete F[a];
  if (t) F[b] = t; else delete F[b];
  commit();
}
function recordSwap(a, b){
  if (a === b){ renderPitch(); return; }
  const isDT = S.clock.phase === 'DT';
  const w = {id:uid(), half:isDT ? 2 : curHalf(), sec:isDT ? 0 : curSec(), dto:isDT, a, b, t:Date.now()};
  S.swaps.push(w); commit();
  toast('Posiciones intercambiadas', () => { S.swaps = S.swaps.filter(x => x.id !== w.id); commit(); });
}
(function bindPitch(){
  const pitch = el('pitch'); let drag = null;
  pitch.addEventListener('pointerdown', e => {
    const s = e.target.closest('.slot'); if (!s || pitchMode() === 'ro') return;
    e.preventDefault();
    drag = {k:s.dataset.slot, el:s, x0:e.clientX, y0:e.clientY, moved:false, filled:!!curMap[s.dataset.slot]};
    try { s.setPointerCapture(e.pointerId); } catch(err){}
  });
  pitch.addEventListener('pointermove', e => {
    if (!drag || !drag.filled) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.moved && Math.hypot(dx, dy) > 8){ drag.moved = true; drag.el.classList.add('dragging'); }
    if (drag.moved) drag.el.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  });
  pitch.addEventListener('pointerup', e => {
    if (!drag) return;
    const d = drag; drag = null;
    const mode = pitchMode();
    if (d.moved){
      const r = pitch.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width * 100, py = (e.clientY - r.top) / r.height * 100;
      let best = null, bd = 1e9;
      SLOTS.forEach(([k,, x, y]) => { const dd = Math.hypot((x - px) * r.width / 100, (y - py) * r.height / 100); if (dd < bd){ bd = dd; best = k; } });
      selSlot = null;
      if (!best || bd > 60){ renderPitch(); return; }
      return mode === 'pre' ? swapFormation(d.k, best) : recordSwap(d.k, best);
    }
    if (mode === 'live'){ if (d.filled) openSub({out:curMap[d.k]}); return; }
    // previa: tocar una y luego otra
    if (selSlot === null){ if (d.filled){ selSlot = d.k; renderPitch(); } }
    else { const a = selSlot; selSlot = null; swapFormation(a, d.k); }
  });
  pitch.addEventListener('pointercancel', () => { drag = null; renderPitch(); });
})();

/* ---------- atención (1 minuto fuera) ---------- */
function attRemaining(a){
  if (a.mode === 'juego'){
    if (!inPlay() || curHalf() !== a.half) return 0;
    return a.dur - (elapsedMs() - a.g);
  }
  return a.dur - (Date.now() - a.w);
}
function activeAtts(){ return S.att.filter(a => !a.done); }
function startAtt(pid){
  if (!inPlay()){ toast('Inicia o reanuda la parte para registrar una atención'); return; }
  if (activeAtts().some(a => a.pid === pid)){ toast('Esta jugadora ya tiene un contador activo'); return; }
  const evId = uid(), p = P(pid);
  S.att.push({id:uid(), pid, evId, mode:S.config.attMode, dur:ATT_SEC*1000, half:curHalf(), g:elapsedMs(), w:Date.now(), done:false, alerted:false});
  S.events.push({id:evId, team:'mcf', type:'att', half:curHalf(), sec:curSec(), pid, dorsal:String(p.dorsal), t:Date.now()});
  commit();
  toast(`${p.corto || p.nombre} (${p.dorsal}) fuera por atención — 1' desde ahora`);
}
let actx = null;
function unlockAudio(){ try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){} }
function beep(){
  try {
    unlockAudio(); const t = actx.currentTime;
    [0, .35, .7].forEach(o => {
      const os = actx.createOscillator(), g = actx.createGain();
      os.frequency.value = 880; os.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.0001, t+o); g.gain.exponentialRampToValueAtTime(.6, t+o+.02); g.gain.exponentialRampToValueAtTime(.0001, t+o+.28);
      os.start(t+o); os.stop(t+o+.3);
    });
  } catch(e){}
  try { navigator.vibrate && navigator.vibrate([300,150,300,150,300]); } catch(e){}
}
function renderAtt(){
  const list = activeAtts();
  let alerted = false;
  el('att').innerHTML = list.map(a => {
    const p = P(a.pid) || {}; const rem = attRemaining(a), ready = rem <= 0;
    if (ready && !a.alerted){ a.alerted = true; alerted = true; }
    return `<div class="attcard ${ready ? 'ready' : ''}">
      <div class="cd">${ready ? ic('check') : fmtCd(rem)}</div>
      <div class="who">${esc(p.dorsal)} · ${esc(p.corto || p.nombre)}<small>${ready ? 'PUEDE VOLVER AL CAMPO' : 'Fuera tras atención' + (a.mode === 'juego' ? ' (tiempo de juego)' : '')}</small></div>
      <button data-act="att-done" data-id="${a.id}">${ready ? 'Ha vuelto' : 'Vuelve ya'}</button>
      <button data-act="att-cancel" data-id="${a.id}" title="Borrar" aria-label="Borrar atención">${ic('x')}</button>
    </div>`;
  }).join('');
  if (alerted){ beep(); save(); }
}

/* ---------- wake lock ---------- */
let wl = null;
async function wake(){ try { if ('wakeLock' in navigator && !wl){ wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); } } catch(e){} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.clock.phase !== 'pre' && S.clock.phase !== 'FIN') wake(); });

/* ---------- controles del reloj ---------- */
function startDT(sec){
  const c = S.clock;
  c.len[1] = sec; Object.assign(c, {phase:'DT', running:false, acc:0, dtSince:Date.now()});
}
async function onPlay(){
  unlockAudio(); const c = S.clock;
  if (c.phase === 'FIN') return newMatch();
  if (c.phase === 'pre'){
    const n = lineup1().length;
    if (n !== 11 && !(await ask(`Hay ${n} titulares marcadas para el 1ºT.\n¿Empezar igualmente?`, 'Empezar'))) return;
    Object.assign(c, {phase:'1T', acc:0, running:true, since:Date.now()});
  } else if (c.phase === 'DT'){
    Object.assign(c, {phase:'2T', acc:0, running:true, since:Date.now()});
  } else if (inPlay()){
    if (c.running){ c.acc = elapsedMs(); c.running = false; }
    else { c.since = Date.now(); c.running = true; }
  } else return;
  wake(); commit();
}
async function onPhase(){
  const c = S.clock;
  if (c.phase === '1T'){ if (!(await ask('¿Finalizar el 1er tiempo?\nA partir de ahora los cambios son de descanso y NO cuentan como ventana.', 'Fin 1ºT'))) return; startDT(curSec()); }
  else if (c.phase === '2T'){ if (!(await ask('¿Finalizar el partido?', 'Fin partido'))) return; c.len[2] = curSec(); Object.assign(c, {phase:'FIN', running:false, acc:0}); save(); if (archiveCurrent()) toast('Partido terminado y guardado en «Partidos guardados»'); }
  else if (c.phase === 'DT'){ if (!(await ask('¿Reabrir el 1er tiempo?\nEl reloj vuelve al final del 1ºT, en pausa.', 'Reabrir'))) return; Object.assign(c, {phase:'1T', running:false, acc:c.len[1]*1000}); }
  else if (c.phase === 'FIN'){ if (!(await ask('¿Reabrir el 2º tiempo?\nEl reloj vuelve al final del 2ºT, en pausa.', 'Reabrir'))) return; Object.assign(c, {phase:'2T', running:false, acc:c.len[2]*1000}); }
  commit();
}
function adjust(sec){
  if (!inPlay()){ toast('El reloj solo se ajusta durante una parte'); return; }
  const c = S.clock;
  const shift = d => { c.acc = Math.max(0, elapsedMs() + d*1000); c.since = Date.now(); };
  shift(sec); commit();
  toast(`Reloj ${sec > 0 ? '+' : '−'}${Math.abs(sec) >= 60 ? Math.abs(sec)/60 + "'" : Math.abs(sec) + '"'}`, () => { shift(-sec); commit(); });
}
/* ---------- partidos guardados (en este dispositivo) ---------- */
const ARCH_KEY = 'hojaPartidoCadete_archivo';
function loadArchive(){ try { return JSON.parse(localStorage.getItem(ARCH_KEY)) || []; } catch(e){ return []; } }
function hasMatchData(st = S){ return st.clock.phase !== 'pre' || st.events.length > 0 || st.subs.length > 0; }
function matchLabel(st){
  const l = st.events.filter(e => e.type === 'gol' && e.team === 'mcf').length, r = st.events.filter(e => e.type === 'gol' && e.team === 'rival').length;
  return `${st.info.jornada ? 'J' + st.info.jornada + ' · ' : ''}${st.config.teamL} ${l}-${r} ${st.config.teamR || 'RIVAL'}`;
}
/* guarda (o actualiza) el partido actual en la lista; devuelve false si no hay espacio */
function archiveCurrent(){
  if (!hasMatchData()) return true;
  const snap = JSON.parse(JSON.stringify(S));
  if (snap.clock.running){ snap.clock.acc = elapsedMs(); snap.clock.running = false; }
  const list = loadArchive().filter(a => a.id !== S.matchId);
  list.unshift({id:S.matchId, savedAt:Date.now(), label:matchLabel(S), fecha:S.info.fecha || '', phase:S.clock.phase, data:snap});
  try { localStorage.setItem(ARCH_KEY, JSON.stringify(list)); return true; }
  catch(e){ toast('No hay espacio para guardar el partido. Descarga y borra partidos antiguos en Ajustes.'); return false; }
}
function archiveHTML(){
  const list = loadArchive();
  if (!list.length) return '<p class="note">Aún no hay partidos guardados. Se guardan solos al pulsar «Fin partido» y al empezar un partido nuevo.</p>';
  const fdate = a => a.fecha ? a.fecha.split('-').reverse().join('/') : new Date(a.savedAt).toLocaleDateString('es-ES');
  return `<ul class="arch">${list.map(a => `<li>
      <div class="arch-t"><b>${esc(a.label)}</b><small>${fdate(a)}${a.phase !== 'FIN' ? ' · sin terminar' : ''}${a.id === S.matchId ? ' · <span class="arch-now">abierto ahora</span>' : ''}</small></div>
      <button data-act="arch-load" data-id="${a.id}" ${a.id === S.matchId ? 'disabled' : ''}>Abrir</button>
      <button data-act="arch-dl" data-id="${a.id}" title="Descargar copia (.json)" aria-label="Descargar copia">${ic('down')}</button>
      <button data-act="arch-del" data-id="${a.id}" class="arch-del" title="Borrar de la lista" aria-label="Borrar partido guardado">${ic('x')}</button>
    </li>`).join('')}</ul>`;
}

async function newMatch(){
  if (!(await ask('¿Empezar un partido nuevo desde el 1er tiempo?\nEl partido actual se guarda en «Partidos guardados» (Ajustes). Se mantienen plantilla, alineación y ajustes.', 'Nuevo partido'))) return;
  if (!archiveCurrent() && !(await ask('No se pudo guardar el partido actual (memoria llena).\n¿Empezar igualmente y perderlo?', 'Empezar igualmente', true))) return;
  Object.assign(S, emptyMatch());
  S.info = Object.assign(S.info, {jornada:'', fecha:'', hora:'', arbitro:''});
  S.config.teamR = ''; S.crestR = null;
  S.players.forEach(p => p.conv = true);
  closeModal(); commit(); setTab('live');
  toast('Partido nuevo listo');
}

function updateClock(){
  const c = S.clock, hm = S.config.halfMin;
  let t = '00:00', add = '', lbl = 'Minuto —';
  if (inPlay()){
    const ms = elapsedMs(), sec = Math.floor(ms/1000);
    t = fmt(ms);
    if (sec >= hm*60) add = '+' + fmt(ms - hm*60000);
    lbl = `Minuto <b>${minStr(curHalf(), sec)}'</b>`;
  } else if (c.phase === 'DT'){ t = fmt(Date.now() - (c.dtSince || Date.now())); lbl = 'Descanso en curso'; }
  else if (c.phase === 'FIN'){ t = 'FINAL'; lbl = ''; }
  el('time').textContent = t;
  el('added').hidden = !add; el('added').textContent = add;
  el('minLbl').innerHTML = lbl;
}

/* ---------- toast ---------- */
let toastT = null;
function toast(msg, undo){
  const t = el('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button id="tUndo">Deshacer</button>' : ''}`;
  t.hidden = false;
  if (undo) el('tUndo').onclick = () => { undo(); t.hidden = true; };
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, undo ? 5000 : 2800);
}

/* ---------- modales ---------- */
function openModal(){ el('modal').hidden = false; }
function closeModal(){ el('modal').hidden = true; el('mbody').innerHTML = ''; }
el('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function openSub(pre){
  const ph = S.clock.phase;
  if (ph === 'FIN'){ toast('El partido ha terminado (reábrelo para corregir)'); return; }
  const isPre = ph === 'pre', isDT = ph === 'DT';
  const half = curHalf(), sec = curSec(), hm = S.config.halfMin;
  const d = derive(), ps = S.players.filter(p => p.conv);
  const onF = ps.filter(p => d.field.has(p.id)).sort(byDor), off = ps.filter(p => !d.field.has(p.id)).sort(byDor);
  let out = pre.out || null, inn = pre.in || null;
  const wins = mcfWindows().filter(w => w.half === half);
  const used = wins.length, left = WINDOWS - used;
  const lastW = wins.filter(w => w.half === half).slice(-1)[0];
  const canHT = ph === '1T' && sec >= (hm - 1) * 60;   // final del 1ºT
  const canHT2 = early2T();                             // el 2ºT aún no ha arrancado
  const newId = mcfWindows().reduce((m,w) => Math.max(m, w.win), 0) + 1;   // id único en todo el partido
  const sameOk = !!lastW && Math.abs(sec - lastW.lastSec) <= S.config.grace;
  let mode = null;
  if (!isPre && !isDT && !canHT && !canHT2){
    if (sameOk) mode = 'same';
    else if (left > 0) mode = 'new';
  }
  const pick = (arr, kind, sel) => `<div class="picks">${arr.map(p => `<button class="pick ${sel === p.id ? 'sel' : ''}" data-kind="${kind}" data-id="${p.id}"><b>${esc(p.dorsal)}</b> ${esc(p.corto || p.nombre)}</button>`).join('') || '<em class="note">—</em>'}</div>`;
  const draw = () => {
    let winHtml;
    if (isPre) winHtml = `<p class="note">Antes de empezar, el cambio solo modifica la alineación inicial (la que entra ocupa la posición de la que sale).</p>`;
    else if (isDT) winHtml = `<p class="info">Cambio en el <b>descanso</b>: NO cuenta como ventana.</p>`;
    else {
      winHtml = `<h4>¿Cuándo se hace el cambio?</h4><div class="seg">
        ${canHT2 ? `<button class="ht ${mode === 'ht2' ? 'sel' : ''}" data-mode="ht2">Del descanso: el 2ºT aún no ha empezado (no cuenta)</button>` : ''}
        ${canHT ? `<button class="ht ${mode === 'ht' ? 'sel' : ''}" data-mode="ht">Ya es el descanso (no cuenta)</button>` : ''}
        ${sameOk ? `<button class="${mode === 'same' ? 'sel' : ''}" data-mode="same">Misma ventana que ${minStr(lastW.half, lastW.sec)}' (V${winNum(lastW.win)})</button>` : ''}
        <button class="${mode === 'new' ? 'sel' : ''}" data-mode="new" ${left <= 0 ? 'disabled' : ''}>${left > 0 ? `Durante el juego: nueva ventana (V${used + 1} de ${WINDOWS} del ${half}ºT)` : `Sin ventanas en el ${half}ºT (${used}/${WINDOWS})`}</button>
      </div>`;
      if (canHT) winHtml += `<p class="info">Estás al final del 1ºT. Si el árbitro <b>ya pitó el descanso</b>, elige «Ya es el descanso»: se cierra el 1ºT y el cambio no gasta ventana. Si el cambio es <b>durante el juego</b> (también en el descuento), sí cuenta.</p>`;
      if (canHT2) winHtml += `<p class="info">Si el balón <b>todavía no se ha puesto en juego</b> en el 2ºT, es un cambio del descanso y no gasta ventana.</p>`;
      if (left <= 0 && sameOk) winHtml += `<p class="warn">Se han usado las ${WINDOWS} ventanas del ${half}ºT. Solo puedes añadir este cambio a la última ventana (misma interrupción del juego).</p>`;
      else if (left <= 0 && !canHT && !canHT2) winHtml += `<p class="warn">Se han usado las ${WINDOWS} ventanas del ${half}ºT. ${half === 1 ? 'Puedes hacer cambios en el descanso o en el 2ºT (tiene sus propias 3 ventanas).' : 'No se pueden hacer más cambios en el 2ºT.'}</p>`;
    }
    const valid = out && inn && (isPre || isDT || mode === 'ht' || mode === 'ht2' || (mode === 'same' && sameOk) || (mode === 'new' && left > 0));
    el('mbody').innerHTML = `<h2>${ic('swap')}Cambio · ${isPre ? 'Alineación inicial' : isDT ? 'Descanso' : 'min ' + minStr(half, sec) + "'"}</h2>
      <h4>Sale</h4>${pick(onF, 'out', out)}
      <h4>Entra</h4>${pick(off, 'in', inn)}
      ${winHtml}
      <div class="mact"><button data-x="cancel">Cancelar</button><button class="primary" data-x="ok" ${valid ? '' : 'disabled'}>Confirmar</button></div>`;
    el('mbody').querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { if (b.dataset.kind === 'out') out = b.dataset.id; else inn = b.dataset.id; draw(); });
    el('mbody').querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; draw(); });
    el('mbody').querySelector('[data-x=cancel]').onclick = closeModal;
    el('mbody').querySelector('[data-x=ok]').onclick = () => {
      if (isPre){
        P(out).t1 = false; P(inn).t1 = true;
        const k = Object.keys(S.formation).find(k => S.formation[k] === out);
        if (k) S.formation[k] = inn;
        closeModal(); commit(); return;
      }
      let s;
      if (isDT || mode === 'ht' || mode === 'ht2'){
        if (mode === 'ht') startDT(sec);
        s = {id:uid(), half:2, sec:0, out, in:inn, dto:true, win:null, t:Date.now()};
      } else {
        if (mode === 'new' && left <= 0) return;   // bloqueo duro: nunca más de 3 ventanas
        const win = mode === 'same' ? lastW.win : newId;
        s = {id:uid(), half, sec, out, in:inn, dto:false, win, t:Date.now()};
      }
      S.subs.push(s);
      S.att.forEach(a => { if (a.pid === out && !a.done) a.done = true; });
      closeModal(); commit();
      toast(`Cambio: sale ${P(out).corto} · entra ${P(inn).corto}${s.dto ? ' (descanso)' : ''}`, () => { S.subs = S.subs.filter(x => x.id !== s.id); commit(); });
    };
  };
  draw(); openModal();
}
async function editWin(id){
  const s = S.subs.find(x => x.id === id); if (!s || s.dto) return;
  const g = S.config.grace, all = mcfWindows();
  const wins = all.filter(w => (w.win !== s.win || w.n > 1) && w.half === s.half
    && (Math.abs(s.sec - w.sec) <= g || Math.abs(s.sec - w.lastSec) <= g || w.win === s.win));
  const opts = wins.map(w => winNum(w.win));
  const canNew = all.filter(w => w.half === s.half).length < WINDOWS || all.find(w => w.win === s.win).n === 1;
  const v = await askText(`Asignar este cambio a la ventana nº ${opts.join(', ') || '—'}${canNew ? '\no escribe «N» para una ventana nueva' : ''}`, String(winNum(s.win)));
  if (v === null) return;
  if (/^n$/i.test(v.trim())){
    if (!canNew){ await say(`No se puede: ya hay ${WINDOWS} ventanas en el ${s.half}ºT.`); return; }
    s.win = all.reduce((m,w) => Math.max(m, w.win), 0) + 1; commit(); return;
  }
  const w = all.filter(x => x.half === s.half)[+v - 1];
  if (!w){ await say('Esa ventana no existe.'); return; }
  if (!wins.some(x => x.win === w.win)){ await say('Solo puedes unir cambios hechos en la misma interrupción del juego (minutos cercanos).'); return; }
  s.win = w.win; commit();
}

function needPlay(){ if (!inPlay()){ toast('Inicia o reanuda la parte para registrar acciones'); return false; } return true; }

function openGoal(team){

        ? `<div class="picks">${onF.map(p => `<button class="pick ${pid === p.id ? 'sel' : ''}" data-pid="${p.id}"><b>${esc(p.dorsal)}</b> ${esc(p.corto || p.nombre)}</button>`).join('')}<button class="pick ${dorsal === 'PP' ? 'sel' : ''}" data-pp="1">P.P. rival</button></div>`
        : `<div class="row"><input id="gDor" inputmode="numeric" placeholder="Dorsal" value="${esc(dorsal === 'PP' ? '' : dorsal)}"><button class="pick ${dorsal === 'PP' ? 'sel' : ''}" data-pp="1">P.P.</button></div>`}
      <h4>Descripción</h4>

      <datalist id="descList">${descs.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
      <div class="mact"><button data-x="cancel">Cancelar</button><button class="primary" data-x="ok">Registrar gol</button></div>`;
    const keep = () => { desc = el('gDesc').value; if (el('gDor')) dorsal = el('gDor').value; };
    el('mbody').querySelectorAll('[data-pid]').forEach(b => b.onclick = () => { keep(); pid = b.dataset.pid; dorsal = ''; draw(); });
    el('mbody').querySelectorAll('[data-pp]').forEach(b => b.onclick = () => { keep(); pid = null; dorsal = dorsal === 'PP' ? '' : 'PP'; draw(); });

      S.events.push(e); closeModal(); commit();
      toast(`Gol ${teamName(team)} (${minStr(half, sec)}')`, () => { S.events = S.events.filter(x => x.id !== e.id); commit(); });
    };
  };
  draw(); openModal();

async function rivalWindow(){
  const addDT = () => { const w = {id:uid(), half:2, sec:0, dto:true, t:Date.now()}; S.rivalWins.push(w); commit(); toast('Cambios rival en el descanso (no cuentan)', () => { S.rivalWins = S.rivalWins.filter(x => x.id !== w.id); commit(); }); };
  if (S.clock.phase === 'DT') return addDT();
  if (!needPlay()) return;
  if (early2T()){
    const r = await dialog({msg:'El 2ºT acaba de empezar. ¿El rival hizo los cambios antes de que se pusiera el balón en juego?', buttons:[['Cancelar', null], ['Durante el juego (cuenta)', 'win'], ['Del descanso (no cuenta)', 'dt', true]]});
    if (r === null) return;
    if (r === 'dt') return addDT();
  }
  const used = winsUsed('rival');
  if (used >= WINDOWS){ await say(`El rival ya ha usado sus ${WINDOWS} ventanas del ${curHalf()}ºT.\nPor reglamento no puede abrir otra en esta parte: avisa al árbitro/delegado.`); return; }
  const w = {id:uid(), half:curHalf(), sec:curSec(), t:Date.now()};
  S.rivalWins.push(w); commit();
  toast(`Ventana rival ${used + 1}/${WINDOWS} del ${w.half}ºT (${minStr(w.half, w.sec)}')`, () => { S.rivalWins = S.rivalWins.filter(x => x.id !== w.id); commit(); });
}
function addEvent(team, type){
  unlockAudio();
  if (type === 'gol') return openGoal(team);
  if (type === 'tar') return openCard(team);
  if (type === 'rwin') return rivalWindow();
  if (!needPlay()) return;
  const e = {id:uid(), team, type, half:curHalf(), sec:curSec(), t:Date.now()};
  S.events.push(e); commit();
  toast(`${EVT[type]} · ${teamName(team)} (${minStr(e.half, e.sec)}')`, () => { S.events = S.events.filter(x => x.id !== e.id); commit(); });
}

function findItem(k, id){ return k === 'ev' ? S.events.find(x => x.id === id) : k === 'sub' ? S.subs.find(x => x.id === id) : S.rivalWins.find(x => x.id === id); }
async function editMin(k, id){
  const it = findItem(k, id); if (!it) return;
  const v = await askText('Nuevo minuto (ej. 35, 45+2, 71, 90+1):', minStr(it.half, it.sec));
  if (v === null) return;
  const r = parseMin(v); if (!r){ await say('Formato no válido.'); return; }
  if (k !== 'ev' && r.half !== it.half){ await say('Un cambio o una ventana no puede pasar a la otra parte. Bórralo y regístralo de nuevo.'); return; }
  it.half = r.half; it.sec = r.sec; commit();
}
async function delItem(k, id){
  if (!(await ask('¿Borrar este registro?', 'Borrar', true))) return;
  if (k === 'ev'){ S.events = S.events.filter(x => x.id !== id); S.att = S.att.filter(a => a.evId !== id); }
  else if (k === 'sub') S.subs = S.subs.filter(x => x.id !== id);
  else S.rivalWins = S.rivalWins.filter(x => x.id !== id);
  commit();
}

/* ---------- hoja imprimible ---------- */
function nameHtml(p){
  const c = (p.corto || '').replace(/\s+[A-ZÁÉÍÓÚ]\.$/, '').trim();
  const n = p.nombre || '';
  if (c){ const i = n.toLowerCase().indexOf(c.toLowerCase()); if (i >= 0) return esc(n.slice(0,i)) + '<b>' + esc(n.slice(i, i + c.length)) + '</b>' + esc(n.slice(i + c.length)); }
  return esc(n);
}
function renderSheet(){
  const d = derive(), C = S.config, I = S.info, hm = C.halfMin, sc = score();
  const byTime = (a,b) => a.half - b.half || a.sec - b.sec;
  const dtL = S.subs.filter(s => s.dto).length, dtR = S.rivalWins.filter(w => w.dto).length;
  const winCells = (team, h) => {
    const ws = winsList(team).filter(w => w.half === h);
    const v = [0,1,2].map(i => ws[i] ? minStr(h, ws[i].sec, false) : '');
    if (ws.length > 3) v[2] = ws.slice(2).map(w => minStr(h, w.sec, false)).join('/');
    v.push(h === 1 ? ((team === 'mcf' ? dtL : dtR) ? '✓' : '') : '');
    return v.map(x => `<td>${x}</td>`).join('');
  };
  const fecha = I.fecha ? I.fecha.split('-').reverse().join('/') : '';

  const conv = S.players.filter(p => p.conv);
  const rows = Math.max(18, conv.length);
  let pr = '';
  for (let i = 0; i < rows; i++){
    const p = conv[i];
    if (!p){ pr += `<tr><td></td><td class="sm">${i+1}</td><td class="name"></td><td></td>${'<td class="sm"></td><td class="sm dbl"></td>'.repeat(3)}<td></td></tr>`; continue; }
    const tit = (d.L1.has(p.id) ? '1' : '') + (d.L2.has(p.id) ? '2' : '');
    const outs = S.subs.filter(s => s.out === p.id).sort(byTime);
    const subMin = s => s.dto ? 'DT' : minStr(s.half, s.sec);
    let cells = '';
    for (let k = 0; k < 3; k++){
      const s = outs[k];
      if (k === 2 && outs.length > 3){
        cells += `<td class="sm">${outs.slice(2).map(s => esc(P(s.in)?.dorsal)).join('/')}</td><td class="sm dbl">${outs.slice(2).map(subMin).join('/')}</td>`;
      } else cells += `<td class="sm">${s ? esc(P(s.in)?.dorsal ?? '') : ''}</td><td class="sm dbl">${s ? subMin(s) : ''}</td>`;
    }
    const played = S.clock.phase === 'pre' ? '' : d.mins[p.id];
    pr += `<tr><td>${tit}</td><td class="sm">${i+1}</td><td class="name">${nameHtml(p)} (${esc(p.pos)})</td><td><b>${esc(p.dorsal)}</b></td>${cells}<td class="tot">${played}</td></tr>`;
  }

  const evMins = (team, type) => {
    let ev = S.events.filter(e => e.team === team && e.type === type);
    if (type === 'tp' && C.goalIsShot) ev = ev.concat(S.events.filter(e => e.team === team && e.type === 'gol'));
    return ev.sort(byTime).map(e => minStr(e.half, e.sec));
  };
  const box = (title, type) => {
    const a = evMins('mcf', type), b = evMins('rival', type);
    const n = Math.max(3, Math.ceil(a.length / 4), Math.ceil(b.length / 4));
    let h = `<table class="box"><tr><td class="cnt">${a.length}</td><th colspan="6">${title}</th><td class="cnt">${b.length}</td></tr>
      <tr class="sub"><td colspan="4">${esc(C.teamL)}</td><td colspan="4">${esc(rivalName())}</td></tr>`;
    for (let r = 0; r < n; r++)
      h += '<tr>' + [0,1,2,3].map(i => `<td>${a[r*4+i] || ''}</td>`).join('') + [0,1,2,3].map(i => `<td>${b[r*4+i] || ''}</td>`).join('') + '</tr>';
    return h + '</table>';
  };
  const goals = S.events.filter(e => e.type === 'gol').sort(byTime);
  let gl = 0, gr = 0; const gL = [], gR = [];
  goals.forEach(g => { if (g.team === 'mcf') gl++; else gr++; (g.team === 'mcf' ? gL : gR).push({res:`${gl}-${gr}`, min:minStr(g.half, g.sec), n:g.dorsal === 'PP' ? 'PP' : (g.pid ? P(g.pid)?.dorsal : g.dorsal) || '', desc:g.desc || ''}); });
  const gn = Math.max(4, gL.length, gR.length);
  let gt = `<table class="gt"><tr><th colspan="4">GOLES ${esc(C.teamL)}</th><th colspan="4">GOLES ${esc(rivalName())}</th></tr>
    <tr><th>Res.</th><th>Min.</th><th>Nº</th><th>Descripción</th><th>Res.</th><th>Min.</th><th>Nº</th><th>Descripción</th></tr>`;
  for (let i = 0; i < gn; i++){
    const a = gL[i] || {}, b = gR[i] || {};
    gt += `<tr><td>${a.res || ''}</td><td>${a.min || ''}</td><td>${esc(a.n || '')}</td><td class="d">${esc(a.desc || '')}</td><td>${b.res || ''}</td><td>${b.min || ''}</td><td>${esc(b.n || '')}</td><td class="d">${esc(b.desc || '')}</td></tr>`;
  }
  gt += '</table>';
  const rec = evMins('mcf', 'rec'), per = evMins('mcf', 'per');
  const rn = Math.max(3, Math.ceil(rec.length / 3), Math.ceil(per.length / 3));
  let rp = `<table class="box"><tr><td class="cnt">${rec.length}</td><th colspan="4">${esc(C.teamL)}</th><td class="cnt">${per.length}</td></tr><tr class="sub"><td colspan="3">RECUPERAC.</td><td colspan="3">PÉRDIDAS</td></tr>`;
  for (let r = 0; r < rn; r++) rp += '<tr>' + [0,1,2].map(i => `<td>${rec[r*3+i] || ''}</td>`).join('') + [0,1,2].map(i => `<td>${per[r*3+i] || ''}</td>`).join('') + '</tr>';
  rp += '</table>';
  const cards = t => S.events.filter(e => e.team === t && e.type === 'tar').sort(byTime).map(e => ({n:e.pid ? P(e.pid)?.dorsal : e.dorsal, c:e.color, m:`${minStr(e.half, e.sec, false)}T${e.half}`}));
  const cL = cards('mcf'), cR = cards('rival'), cn = Math.max(3, cL.length, cR.length);
  let ct = `<table class="box"><tr><td class="cnt">${cL.length}</td><th colspan="4">TARJETAS</th><td class="cnt">${cR.length}</td></tr><tr class="sub"><td colspan="3">${esc(C.shortL)}</td><td colspan="3">${esc(C.shortR)}</td></tr><tr class="sub"><td>Nº</td><td>COL.</td><td>Min.</td><td>Nº</td><td>COL.</td><td>Min.</td></tr>`;
  for (let i = 0; i < cn; i++){ const a = cL[i] || {}, b = cR[i] || {}; ct += `<tr><td>${esc(a.n || '')}</td><td>${a.c || ''}</td><td>${a.m || ''}</td><td>${esc(b.n || '')}</td><td>${b.c || ''}</td><td>${b.m || ''}</td></tr>`; }
  ct += '</table>';
  const at = S.events.filter(e => e.type === 'att').sort(byTime).map(e => ({n:e.pid ? P(e.pid)?.dorsal : e.dorsal, m:minStr(e.half, e.sec)}));
  const an = Math.max(3, Math.ceil(at.length / 2));
  let atb = `<table class="box"><tr><td class="cnt">${at.length}</td><th colspan="3">ATENCIONES (1')</th></tr><tr class="sub"><td>Nº</td><td>Min.</td><td>Nº</td><td>Min.</td></tr>`;
  for (let r = 0; r < an; r++){ const a = at[r*2] || {}, b = at[r*2+1] || {}; atb += `<tr><td>${esc(a.n || '')}</td><td>${a.m || ''}</td><td>${esc(b.n || '')}</td><td>${b.m || ''}</td></tr>`; }
  atb += '</table>';
  ensureFormation();

  el('sheet').innerHTML = `
  <div class="sh-top">
    <img class="sh-crest" src="${crestL()}" alt="">
    <div class="sh-titlebox">
      <div class="sh-title">1ª ANDALUZA CADETE FEMENINO</div>
      <table class="wt">
        <tr><th>1ºT</th><th>V1</th><th>V2</th><th>V3</th><th>DTO</th><th class="gap"></th><th>2ºT</th><th>V1</th><th>V2</th><th>V3</th><th>DTO</th></tr>
        <tr><td class="tl">${esc(C.shortL)}</td>${winCells('mcf',1)}<td class="gap"></td><td class="tl">${esc(C.shortL)}</td>${winCells('mcf',2)}</tr>
        <tr><td class="tl">${esc(C.shortR)}</td>${winCells('rival',1)}<td class="gap"></td><td class="tl">${esc(C.shortR)}</td>${winCells('rival',2)}</tr>
      </table>
    </div>
  </div>
  <div class="sh-match">
    <img src="${crestL()}" alt=""><span>CADETE FEMENINO ${esc(C.teamL)}</span><span class="vs">vs</span>
    <span class="rbox">${esc(C.teamR)}</span>${S.crestR ? `<img src="${S.crestR}" alt="">` : ''}
  </div>
  <div class="sh-info">
    <div class="ir"><label>COMPETICIÓN:</label><span class="v">${esc(I.competicion)}</span><label>JORNADA:</label><span class="v s">${esc(I.jornada)}</span></div>
    <div class="ir"><label>FECHA:</label><span class="v s">${esc(fecha)}</span><label>HORA:</label><span class="v s">${esc(I.hora)}</span><label>RESULTADO:</label><span class="v s"><b>${sc.l} - ${sc.r}</b></span></div>
    <div class="ir"><label>CAMPO:</label><span class="v">${esc(I.campo)}</span></div>
    <div class="ir"><label><b>ÁRBITRO:</b></label><span class="v" style="text-align:left">${esc(I.arbitro)}</span></div>
  </div>
  <div class="sh-body">
    <div class="sh-left">
    <table class="pt">
      <tr><th rowspan="2"><div class="vert">TITULARES</div></th><th rowspan="2"><div class="vert">CONVOCADAS</div></th><th rowspan="2">JUGADORAS</th><th rowspan="2"><div class="vert">DORSAL</div></th><th colspan="6">CAMBIOS</th><th rowspan="2">Total<br>Min.</th></tr>
      <tr><th>Entra</th><th class="dbl">Min.</th><th>Entra</th><th class="dbl">Min.</th><th>Entra</th><th class="dbl">Min.</th></tr>
      ${pr}
    </table>
    ${gt}
    <div class="sh-row">${rp}</div>
    </div>
    <div class="sh-right">
      ${[['TIROS A PUERTA','tp'],['TIROS FUERA','tf'],['S. ESQUINA','cor'],['FUERA JUEGO','fj']].map(([t, k]) => `<div class="sh-cap">Anotamos el minuto</div>${box(t, k)}`).join('')}
      <div class="sh-cap">Anotamos el minuto</div>${ct}
      ${atb}
    </div>
  </div>
  <div class="sh-note">Titulares: 1 = 1ºT, 2 = 2ºT, 12 = ambos. Minutos acumulados (2ºT = ${hm}-${hm * 2}). Ventanas: máximo ${WINDOWS} por equipo y parte; DTO ✓ = hubo cambios en el descanso (no cuentan como ventana)${dtL ? `: ${esc(C.shortL)} ${dtL} cambio${dtL > 1 ? 's' : ''}` : ''}.</div>
  <div class="sh-foot">by Curro García</div>`;
}

/* ---------- ajustes ---------- */
function renderCfg(){
  const I = S.info, C = S.config;
  const f = (lbl, path, val, type = 'text', extra = '') => `<label class="fld"><span>${lbl}</span><input type="${type}" data-f="${path}" value="${esc(val)}" ${extra}></label>`;
  const sel = (lbl, path, val, opts) => `<label class="fld"><span>${lbl}</span><select data-f="${path}">${opts.map(([v,t]) => `<option value="${v}" ${String(v) === String(val) ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`;
  el('tab-cfg').innerHTML = `
    <div class="actions" style="margin:0 0 6px"><button class="gold" data-act="new-match">${ic('new')}Nuevo partido (empezar desde el 1er tiempo)</button></div>
    <h3>Equipos y escudos</h3>
    <div class="crests">
      <div class="crestbox"><img src="${crestL()}" alt=""><div><b>${esc(C.teamL)}</b><div class="actions"><button data-act="crest-l">Cambiar</button>${S.crestL ? '<button data-act="crest-l-reset">Original</button>' : ''}</div></div></div>
      <div class="crestbox">${S.crestR ? `<img src="${S.crestR}" alt="">` : '<div class="ph">Escudo</div>'}<div><b>${esc(rivalName())}</b><div class="actions"><button data-act="crest-r">${S.crestR ? 'Cambiar' : 'Subir escudo rival'}</button>${S.crestR ? '<button data-act="crest-r-del">Quitar</button>' : ''}</div></div></div>
    </div>
    <h3>Datos del partido</h3>
    <div class="fgrid">
      ${f('Equipo propio','config.teamL',C.teamL)}${f('Abreviatura propio','config.shortL',C.shortL)}
      ${f('Rival','config.teamR',C.teamR,'text','placeholder="Nombre del rival"')}${f('Abreviatura rival','config.shortR',C.shortR)}
      ${f('Competición','info.competicion',I.competicion)}${f('Jornada','info.jornada',I.jornada)}
      ${f('Fecha','info.fecha',I.fecha,'date')}${f('Hora','info.hora',I.hora,'text','placeholder="Ej. 12:00 (cita 10:30)"')}
      ${f('Campo','info.campo',I.campo)}${f('Árbitro(s)','info.arbitro',I.arbitro)}
    </div>
    <h3>Reglas y reloj</h3>
    <p class="note">Fijo por reglamento: partes de ${C.halfMin}', máximo ${WINDOWS} ventanas por equipo en cada parte (los cambios del descanso no cuentan) y 1' fuera tras una atención (empieza al pulsar el botón de atención, con la jugadora ya fuera).</p>
    <div class="fgrid">
      ${f('Segundos para agrupar cambios en la misma ventana','config.grace',C.grace,'number','min="0" max="600" data-num="1"')}
      ${sel('El minuto de atención corre en','config.attMode',C.attMode,[['real','Tiempo real (no se para)'],['juego','Tiempo de juego (se para con el reloj)']])}
      ${sel('Formato del minuto','config.minuteMode',C.minuteMode,[['clock','Minuto de reloj (14:20 → 14\')'],['current','Minuto en curso (14:20 → 15\')']])}
      ${sel('¿El gol cuenta como tiro a puerta?','config.goalIsShot',C.goalIsShot,[['false','No'],['true','Sí']])}
    </div>
    <h3>Plantilla <small>(Conv. = convocada · 1ºT = titular en el 1er tiempo)</small></h3>
    <div class="rwrap"><table class="roster">
      <tr><th>Conv.</th><th>1ºT</th><th>Dorsal</th><th>Nombre completo</th><th>Nombre corto</th><th>Posición</th><th></th></tr>
      ${S.players.map(p => `<tr>
        <td><input type="checkbox" data-pid="${p.id}" data-k="conv" ${p.conv ? 'checked' : ''}></td>
        <td><input type="checkbox" data-pid="${p.id}" data-k="t1" ${p.t1 ? 'checked' : ''}></td>
        <td><input class="n" type="number" data-pid="${p.id}" data-k="dorsal" value="${esc(p.dorsal)}"></td>
        <td><input data-pid="${p.id}" data-k="nombre" value="${esc(p.nombre)}"></td>
        <td><input data-pid="${p.id}" data-k="corto" value="${esc(p.corto)}"></td>
        <td><input data-pid="${p.id}" data-k="pos" value="${esc(p.pos)}"></td>
        <td><button data-act="del-player" data-id="${p.id}" title="Eliminar" aria-label="Eliminar jugadora">${ic('x')}</button></td></tr>`).join('')}
    </table></div>
    <div class="actions"><button data-act="add-player">+ Añadir jugadora</button></div>
    <h3>Partidos guardados <small>en este iPad</small></h3>
    <div class="actions" style="margin:0 0 10px"><button data-act="arch-save">Guardar partido actual</button></div>
    ${archiveHTML()}
    <h3>Datos</h3>
    <div class="actions">
      <button data-act="export">Exportar partido (.json)</button>
      <button data-act="import">Importar partido</button>
      <button data-act="reset" class="danger">Borrar todo</button>
    </div>
    <p class="note">Todo se guarda en este dispositivo automáticamente. Las actualizaciones de la app no borran nada. Para tener copia fuera del iPad, descarga el .json de cada partido.</p>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <input type="file" id="crestIn" accept="image/*" hidden>`;
}
let crestTarget = 'r';
function readCrest(file){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const m = 180, s = Math.min(1, m / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const url = cv.toDataURL('image/png');
      if (crestTarget === 'l') S.crestL = url; else S.crestR = url;
      commit(); renderCfg();
    };
    img.onerror = () => say('No se pudo leer la imagen.');
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
el('tab-cfg').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'crestIn'){ if (t.files[0]) readCrest(t.files[0]); t.value = ''; return; }
  if (t.id === 'fileIn'){
    const file = t.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); if (!o.players || !o.clock) throw 0; archiveCurrent(); S = o; normalize(); archiveCurrent(); commit(); renderCfg(); toast('Partido importado'); } catch(err){ say('Archivo no válido.'); } };
    r.readAsText(file); t.value = ''; return;
  }
  if (t.dataset.f){
    const [a, b] = t.dataset.f.split('.');
    let v = t.value;
    if (t.dataset.num) v = Math.max(+t.min || 0, +v || 0);
    if (v === 'true') v = true; else if (v === 'false') v = false;
    S[a][b] = v; commit(); return;
  }
  if (t.dataset.pid){
    const p = P(t.dataset.pid); if (!p) return;
    const k = t.dataset.k;
    p[k] = t.type === 'checkbox' ? t.checked : (k === 'dorsal' ? (+t.value || 0) : t.value);
    commit();
  }
});

/* ---------- acciones globales ---------- */
function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.addEventListener('pointerdown', unlockAudio, {once:true});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act],[data-adj],[data-tab]');
  if (!b || b.closest('#dlg')) return;
  if (b.dataset.adj) return adjust(+b.dataset.adj);
  if (b.dataset.tab) return setTab(b.dataset.tab);
  const id = b.dataset.id;
  switch (b.dataset.act){
    case 'sub-out': return openSub({out:id});
    case 'sub-in': return openSub({in:id});
    case 'att': return startAtt(id);
    case 'att-done': { const a = S.att.find(x => x.id === id); if (a){ a.done = true; commit(); } return; }
    case 'att-cancel': { const a = S.att.find(x => x.id === id); if (a){ S.att = S.att.filter(x => x.id !== id); S.events = S.events.filter(x => x.id !== a.evId); commit(); } return; }
    case 'ev': return addEvent(b.dataset.team, b.dataset.type);
    case 'edit-min': return editMin(b.dataset.k, id);
    case 'edit-win': return editWin(id);
    case 'del': return delItem(b.dataset.k, id);
    case 'crest-l': crestTarget = 'l'; return el('crestIn').click();
    case 'crest-r': crestTarget = 'r'; return el('crestIn').click();
    case 'crest-l-reset': S.crestL = null; commit(); return renderCfg();
    case 'crest-r-del': S.crestR = null; commit(); return renderCfg();
    case 'new-match': await newMatch(); if (tab === 'cfg') renderCfg(); return;
    case 'reset': if (!(await ask('¿Borrar TODO, plantilla incluida?', 'Borrar todo', true))) return; S = blankState(); normalize(); commit(); renderCfg(); return;
    case 'export': return download(`hoja_${S.info.fecha || 'partido'}_${(rivalName()).replace(/\s+/g,'_')}.json`, JSON.stringify(S, null, 2));
    case 'import': return el('fileIn').click();
    case 'arch-save': { if (!hasMatchData()){ toast('Este partido aún no tiene datos'); return; } if (archiveCurrent()) toast('Partido guardado'); return renderCfg(); }
    case 'arch-load': {
      const a = loadArchive().find(x => x.id === id); if (!a) return;
      if (!(await ask(`¿Abrir «${a.label}»?\nEl partido actual se guarda antes en la lista.`, 'Abrir'))) return;
      if (!archiveCurrent()) return;
      S = JSON.parse(JSON.stringify(a.data)); normalize(); commit(); renderCfg();
      toast('Partido abierto. Revisa la pestaña Hoja para imprimir.'); return;
    }
    case 'arch-dl': { const a = loadArchive().find(x => x.id === id); if (a) download(`hoja_${a.fecha || 'partido'}_${(a.data.config.teamR || 'rival').replace(/\s+/g,'_')}.json`, JSON.stringify(a.data, null, 2)); return; }
    case 'arch-del': {
      const a = loadArchive().find(x => x.id === id); if (!a) return;
      if (!(await ask(`¿Borrar «${a.label}» de la lista?\nNo se puede deshacer. Si quieres conservarlo, descárgalo antes.`, 'Borrar', true))) return;
      localStorage.setItem(ARCH_KEY, JSON.stringify(loadArchive().filter(x => x.id !== id))); return renderCfg();
    }
    case 'add-player': S.players.push({id:uid(), nombre:'', corto:'', pos:'', dorsal:0, conv:true, t1:false}); commit(); renderCfg(); return;
    case 'del-player': {
      const used = S.subs.some(s => s.out === id || s.in === id) || S.events.some(x => x.pid === id);
      if (!(await ask(used ? 'Esta jugadora tiene cambios o acciones registradas en el partido. ¿Eliminarla igualmente?' : '¿Eliminar jugadora?', 'Eliminar', true))) return;
      S.players = S.players.filter(p => p.id !== id); commit(); renderCfg(); return;
    }
  }
});
el('btnPlay').onclick = onPlay;
el('btnPhase').onclick = onPhase;
el('btnPrint').onclick = () => { renderSheet(); window.print(); };

let tab = 'live';
function setTab(t){
  tab = t;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  el('tab-live').hidden = t !== 'live'; el('tab-sheet').hidden = t !== 'sheet'; el('tab-cfg').hidden = t !== 'cfg';
  if (t === 'sheet') renderSheet();
  if (t === 'cfg') renderCfg();
}

/* ---------- bucle ---------- */
let lastKey = '';
setInterval(() => {
  updateClock();
  if (activeAtts().length) renderAtt();
  const key = S.clock.phase + ':' + (inPlay() ? label(curSec()) + ':' + early2T() : '');
  if (key !== lastKey){ lastKey = key; renderPlayers(); if (tab === 'sheet') renderSheet(); }
}, 250);

renderAll();

/* ---------- modo sin conexión (solo cuando está publicada en una web) ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'))
  navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
